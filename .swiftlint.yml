# SwiftLint Configuration for PawConnect
# https://github.com/realm/SwiftLint

# Paths to include (default: all)
included:
  - PawConnect

# Paths to exclude
excluded:
  - PawConnect/.build
  - PawConnect/Asset-Staging
  - .build
  - DerivedData

# Rules
disabled_rules:
  - trailing_comma
  - todo

opt_in_rules:
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - first_where
  - force_unwrapping
  - implicit_return
  - last_where
  - missing_docs
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_self_in_static_references
  - private_action
  - private_outlet
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

# Configuration
line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 400
  error: 600

type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 50
  error: 100

function_parameter_count:
  warning: 6
  error: 8

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - x
    - y
    - r
    - g
    - b
    - a
    - i

type_name:
  min_length:
    warning: 3
    error: 2
  max_length:
    warning: 50
    error: 60

nesting:
  type_level:
    warning: 3
  function_level:
    warning: 5

reporter: xcode
