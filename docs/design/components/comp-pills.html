<!-- @dsCard group="Components" -->
<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:22px;background:var(--bg-primary);font-family:var(--font-sans)}
  .row{display:flex;gap:8px;margin-bottom:14px}
  .pill{height:38px;padding:0 16px;border-radius:9999px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px}
  .on{background:var(--sunset);color:#fff}
  .off{background:#fff;color:var(--text-secondary);box-shadow:inset 0 0 0 1px var(--border)}
  .chip{display:inline-flex;align-items:baseline;gap:2px;background:#fff;border-radius:12px;padding:10px 16px;box-shadow:var(--shadow-card);margin-right:10px}
  .chip .p{font-size:17px;font-weight:600;color:var(--text-primary)}
  .chip .u{font-size:12px;color:var(--text-tertiary)}
</style></head>
<body>
  <div class="row">
    <div class="pill on">🐕 Dogs</div>
    <div class="pill off">🐈 Cats</div>
    <div class="pill off">🐾 Other</div>
  </div>
  <div>
    <span class="chip"><span class="p">$25</span><span class="u">/walk</span></span>
    <span class="chip"><span class="p">$22</span><span class="u">/visit</span></span>
    <span class="chip"><span class="p">$75</span><span class="u">/night</span></span>
  </div>
</body></html>
