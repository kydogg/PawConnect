<!-- @dsCard group="Components" -->
<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:22px;background:var(--bg-primary);font-family:var(--font-sans)}
  .grid{display:flex;flex-direction:column;gap:16px;max-width:320px}
  .lbl{font-size:13px;font-weight:500;color:var(--text-secondary);margin-bottom:6px}
  .field{height:48px;background:#fff;border-radius:8px;display:flex;align-items:center;padding:0 16px;font-size:16px;color:var(--text-tertiary);box-shadow:inset 0 0 0 1px var(--border)}
  .field.focus{box-shadow:inset 0 0 0 1px var(--sunset)}
  .field.val{color:var(--text-primary);justify-content:space-between}
  .err{font-size:12px;color:var(--terracotta);margin-top:4px}
  .eye{color:var(--text-tertiary)}
</style></head>
<body>
  <div class="grid">
    <div><div class="lbl">Email</div><div class="field focus val">you@example.com</div></div>
    <div><div class="lbl">Password</div><div class="field val">••••••••<span class="eye">&#128065;</span></div></div>
    <div><div class="lbl">Email</div><div class="field val" style="box-shadow:inset 0 0 0 1px var(--terracotta)">invalid</div><div class="err">Please enter a valid email</div></div>
  </div>
</body></html>
