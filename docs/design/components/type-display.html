<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--bg-primary);font-family:var(--font-sans)}
  .row{display:flex;align-items:baseline;gap:14px;padding:10px 0;border-bottom:1px solid var(--border)}
  .row:last-child{border-bottom:none}
  .tok{width:120px;flex-shrink:0;font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}
  .spec{margin-left:auto;font-size:11px;color:var(--text-tertiary);white-space:nowrap}
</style></head>
<body>
  <div class="row"><span class="tok">displayLarge</span><span class="pc-display">Welcome home</span><span class="spec">34 · Bold</span></div>
  <div class="row"><span class="tok">headingH1</span><span class="pc-h1">Find a sitter</span><span class="spec">24 · Bold</span></div>
  <div class="row"><span class="tok">headingH2</span><span class="pc-h2">Trusted neighborhood care</span><span class="spec">20 · Semibold</span></div>
  <div class="row"><span class="tok">headingH3</span><span class="pc-h3">Maya Okafor</span><span class="spec">17 · Semibold</span></div>
</body></html>
