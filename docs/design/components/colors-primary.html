<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--bg-primary);font-family:var(--font-sans)}
  .row{display:flex;gap:12px}
  .sw{flex:1}
  .chip{height:72px;border-radius:12px;box-shadow:var(--shadow-card);display:flex;align-items:flex-end;padding:8px;box-sizing:border-box;color:#fff;font-size:11px;font-weight:600}
  .name{font-size:12px;font-weight:600;color:var(--text-primary);margin-top:8px}
  .hex{font-size:11px;color:var(--text-tertiary);font-family:var(--font-mono)}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#EA580C">Primary</div><div class="name">Sunset</div><div class="hex">#EA580C</div></div>
    <div class="sw"><div class="chip" style="background:#DC2626">Pressed</div><div class="name">Terracotta</div><div class="hex">#DC2626</div></div>
    <div class="sw"><div class="chip" style="background:#FB923C">Accent</div><div class="name">Peach</div><div class="hex">#FB923C</div></div>
    <div class="sw"><div class="chip" style="background:#F59E0B">Rating</div><div class="name">Amber</div><div class="hex">#F59E0B</div></div>
    <div class="sw"><div class="chip" style="background:#059669">Trust</div><div class="name">Sage</div><div class="hex">#059669</div></div>
  </div>
</body></html>
