<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--bg-primary);font-family:var(--font-sans);display:flex;align-items:center;gap:40px}
  .lock{display:flex;align-items:center;gap:14px}
  .mark{background:var(--sunset);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 4px 12px rgba(234,88,12,.3)}
  .word{font-size:30px;font-weight:700;color:var(--text-primary);letter-spacing:-.5px}
  .tag{font-size:13px;color:var(--text-secondary)}
  .stack{display:flex;flex-direction:column;align-items:center;gap:8px}
  svg.paw{fill:#fff}
</style></head>
<body>
  <div class="stack">
    <div class="lock">
      <div class="mark" style="width:48px;height:48px">
        <svg class="paw" width="26" height="26" viewBox="0 0 24 24"><ellipse cx="6" cy="11" rx="2.1" ry="2.7"/><ellipse cx="11" cy="8.2" rx="2.2" ry="2.9"/><ellipse cx="16.4" cy="9.4" rx="2.1" ry="2.7"/><ellipse cx="19" cy="14" rx="1.8" ry="2.3"/><path d="M11.6 13.2c2.6 0 4.7 1.7 5.2 3.9.4 1.8-1 3.2-2.7 3-1-.1-1.7-.5-2.5-.5s-1.5.4-2.5.5c-1.7.2-3.1-1.2-2.7-3 .5-2.2 2.6-3.9 5.2-3.9Z"/></svg>
      </div>
      <div><div class="word">PawConnect</div></div>
    </div>
    <div class="tag">Peace of mind, one paw at a time</div>
  </div>
  <div style="display:flex;gap:16px;align-items:center">
    <div class="mark" style="width:32px;height:32px;border-radius:8px"><svg class="paw" width="18" height="18" viewBox="0 0 24 24"><ellipse cx="6" cy="11" rx="2.1" ry="2.7"/><ellipse cx="11" cy="8.2" rx="2.2" ry="2.9"/><ellipse cx="16.4" cy="9.4" rx="2.1" ry="2.7"/><ellipse cx="19" cy="14" rx="1.8" ry="2.3"/><path d="M11.6 13.2c2.6 0 4.7 1.7 5.2 3.9.4 1.8-1 3.2-2.7 3-1-.1-1.7-.5-2.5-.5s-1.5.4-2.5.5c-1.7.2-3.1-1.2-2.7-3 .5-2.2 2.6-3.9 5.2-3.9Z"/></svg></div>
    <div class="mark" style="width:48px;height:48px"><svg class="paw" width="26" height="26" viewBox="0 0 24 24"><ellipse cx="6" cy="11" rx="2.1" ry="2.7"/><ellipse cx="11" cy="8.2" rx="2.2" ry="2.9"/><ellipse cx="16.4" cy="9.4" rx="2.1" ry="2.7"/><ellipse cx="19" cy="14" rx="1.8" ry="2.3"/><path d="M11.6 13.2c2.6 0 4.7 1.7 5.2 3.9.4 1.8-1 3.2-2.7 3-1-.1-1.7-.5-2.5-.5s-1.5.4-2.5.5c-1.7.2-3.1-1.2-2.7-3 .5-2.2 2.6-3.9 5.2-3.9Z"/></svg></div>
    <div class="mark" style="width:64px;height:64px;border-radius:16px"><svg class="paw" width="36" height="36" viewBox="0 0 24 24"><ellipse cx="6" cy="11" rx="2.1" ry="2.7"/><ellipse cx="11" cy="8.2" rx="2.2" ry="2.9"/><ellipse cx="16.4" cy="9.4" rx="2.1" ry="2.7"/><ellipse cx="19" cy="14" rx="1.8" ry="2.3"/><path d="M11.6 13.2c2.6 0 4.7 1.7 5.2 3.9.4 1.8-1 3.2-2.7 3-1-.1-1.7-.5-2.5-.5s-1.5.4-2.5.5c-1.7.2-3.1-1.2-2.7-3 .5-2.2 2.6-3.9 5.2-3.9Z"/></svg></div>
  </div>
