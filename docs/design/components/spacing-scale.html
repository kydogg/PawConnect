<!-- @dsCard group="Spacing" -->
<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:22px;background:var(--bg-primary);font-family:var(--font-sans)}
  .row{display:flex;align-items:center;gap:14px;margin-bottom:9px}
  .tok{width:120px;font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}
  .bar{height:18px;background:rgba(234,88,12,.18);border:1px solid var(--sunset);border-radius:3px}
  .val{font-size:11px;color:var(--text-secondary)}
</style></head>
<body>
  <div class="row"><span class="tok">xs · 4</span><div class="bar" style="width:4px"></div></div>
  <div class="row"><span class="tok">sm · 8</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="tok">md · 16</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="tok">lg · 24</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="tok">xl · 32</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="tok">xxl · 48</span><div class="bar" style="width:48px"></div></div>
  <div class="row"><span class="tok">xxxl · 64</span><div class="bar" style="width:64px"></div></div>
</body></html>
