<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--bg-primary);font-family:var(--font-sans)}
  .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:16px 12px}
  .i{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--text-secondary)}
  .i span{font-size:8.5px;color:var(--text-tertiary);font-family:var(--font-mono);text-align:center}
  svg{display:block}
</style></head>
<body>
  <div class="grid">
    <div class="i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span>chevron.left</span></div>
    <div class="i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg><span>xmark</span></div>

    <div class="i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M5 12v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"/></svg><span>square.and.arrow.up</span></div>
    <div class="i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span>plus</span></div>
    <div class="i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3Z"/><path d="M14 7l3 3"/></svg><span>pencil</span></div>
    <div class="i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></svg><span>trash</span></div>

    <div class="i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4v16M8 20l-3-3M8 4l3 3M16 20V4M16 4l-3 3M16 20l3-3"/></svg><span>arrow.up.arrow.down</span></div>
    <div class="i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2.6M12 18.9v2.6M21.5 12h-2.6M5.1 12H2.5M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8M18.7 18.7l-1.8-1.8M7.1 7.1L5.3 5.3"/></svg><span>gearshape</span></div>
    <div class="i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>magnifyingglass</span></div>
    <div class="i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 9h18M8 3v4M16 3v4"/></svg><span>calendar</span></div>

    <div class="i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span>bell.fill</span></div>
    <div class="i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c5-5.3 7-8.5 7-11a7 7 0 1 0-14 0c0 2.5 2 5.7 7 11Z"/><circle cx="12" cy="10" r="2.6"/></svg><span>mappin</span></div>
    <div class="i" style="color:var(--amber)"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.9 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9L12 2.5Z"/></svg><span>star.fill</span></div>
    <div class="i" style="color:var(--terracotta)"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.3C.3 8.4 1.7 4.8 5.2 4.2 7.4 3.8 9.4 5 12 7.7c2.6-2.7 4.6-3.9 6.8-3.5 3.5.6 4.9 4.2 3.2 7.5C19.5 16.4 12 21 12 21Z"/></svg><span>heart.fill</span></div>
    <div class="i" style="color:var(--sage)"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.6l2.6 1.9 3.2-.2 1 3.1 2.6 1.9-1 3 1 3-2.6 1.9-1 3.1-3.2-.2L12 22.4l-2.6-1.9-3.2.2-1-3.1L2.6 15.7l1-3-1-3 2.6-1.9 1-3.1 3.2.2L12 1.6Z"/><path d="M8.5 12l2.3 2.3 4.7-4.8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span>checkmark.seal.fill</span></div>
    <div class="i" style="color:var(--sage)"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.3l3 3 6-6.3" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span>checkmark.circle.fill</span></div>
    <div class="i" style="color:var(--amber)"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M10.3 3.2 1.6 18.4A2 2 0 0 0 3.3 21.4h17.4a2 2 0 0 0 1.7-3L13.7 3.2a2 2 0 0 0-3.4 0Z"/><path d="M12 9v5M12 17.2h.01" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg><span>warning</span></div>
    <div class="i" style="color:var(--sunset)"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><ellipse cx="6" cy="11" rx="2.1" ry="2.7"/><ellipse cx="11" cy="8.2" rx="2.2" ry="2.9"/><ellipse cx="16.4" cy="9.4" rx="2.1" ry="2.7"/><ellipse cx="19" cy="14" rx="1.8" ry="2.3"/><path d="M11.6 13.2c2.6 0 4.7 1.7 5.2 3.9.4 1.8-1 3.2-2.7 3-1-.1-1.7-.5-2.5-.5s-1.5.4-2.5.5c-1.7.2-3.1-1.2-2.7-3 .5-2.2 2.6-3.9 5.2-3.9Z"/></svg><span>pawprint.fill</span></div>
    <div class="i" style="color:var(--amber)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5 12 5a3.5 3.5 0 0 1 5 5l-7.5 7.5a3.5 3.5 0 0 1-5-5Z"/><path d="M8.2 8.2l5.6 5.6"/></svg><span>pills.fill</span></div>
    <div class="i" style="color:var(--sage)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4.5" r="2"/><path d="M13 8l-3 4 1 4M10 12l-2.5 2M14 11l3 2-1.5 4M11 16l-2 5M16 17l1 4"/></svg><span>figure.walk</span></div>
