<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--bg-primary);font-family:var(--font-sans)}
  .row{display:flex;gap:6px}
  .sw{flex:1;text-align:center}
  .chip{height:64px;border-radius:8px}
  .name{font-size:10px;font-weight:600;color:var(--text-secondary);margin-top:6px}
  .hex{font-size:9px;color:var(--text-tertiary);font-family:var(--font-mono)}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#FFFBF5;box-shadow:inset 0 0 0 1px #FAE5D3"></div><div class="name">Cream 50</div><div class="hex">#FFFBF5</div></div>
    <div class="sw"><div class="chip" style="background:#FEF3E2"></div><div class="name">Ivory 100</div><div class="hex">#FEF3E2</div></div>
    <div class="sw"><div class="chip" style="background:#FAE5D3"></div><div class="name">Sand 200</div><div class="hex">#FAE5D3</div></div>
    <div class="sw"><div class="chip" style="background:#F0D5C1"></div><div class="name">Beige 300</div><div class="hex">#F0D5C1</div></div>
    <div class="sw"><div class="chip" style="background:#D4A574"></div><div class="name">Tan 400</div><div class="hex">#D4A574</div></div>
    <div class="sw"><div class="chip" style="background:#B08968"></div><div class="name">Clay 500</div><div class="hex">#B08968</div></div>
    <div class="sw"><div class="chip" style="background:#8B6F47"></div><div class="name">Umber 600</div><div class="hex">#8B6F47</div></div>
    <div class="sw"><div class="chip" style="background:#5D4E37"></div><div class="name">Coffee 700</div><div class="hex">#5D4E37</div></div>
    <div class="sw"><div class="chip" style="background:#3E342A"></div><div class="name">Espresso 800</div><div class="hex">#3E342A</div></div>
    <div class="sw"><div class="chip" style="background:#1F1B17"></div><div class="name">Charcoal 900</div><div class="hex">#1F1B17</div></div>
  </div>
</body></html>
