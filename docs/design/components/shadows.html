<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:28px 24px;background:var(--bg-primary);font-family:var(--font-sans);display:flex;gap:26px}
  .item{text-align:center}
  .box{width:96px;height:72px;background:#fff;border-radius:12px}
  .name{font-size:12px;font-weight:600;color:var(--text-primary);margin-top:16px}
  .val{font-size:10px;color:var(--text-tertiary);font-family:var(--font-mono)}
</style></head>
<body>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-card)"></div><div class="name">shadowCard</div><div class="val">0 2 8 / .08</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-float)"></div><div class="name">shadowFloat</div><div class="val">0 4 16 / .12</div></div>
  <div class="item"><div class="box" style="box-shadow:0 8px 24px rgba(31,27,23,.16)"></div><div class="name">shadowModal</div><div class="val">0 8 24 / .16</div></div>
</body></html>
