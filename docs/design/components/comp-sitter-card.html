<!-- @dsCard group="Components" -->
<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);display:flex}
  .pane{flex:1;padding:20px}
  .pane.dark{background:#1A1613}
  .pane.light{background:#FFFBF5}
  .tag{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:12px}
  .card{background:var(--bg-elevated);border-radius:12px;box-shadow:var(--shadow-card);padding:16px;display:flex;align-items:center;gap:14px}
  .av{width:56px;height:56px;border-radius:50%;flex-shrink:0;background:linear-gradient(150deg,#FED7AA,#FDBA8C);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px;text-shadow:0 1px 2px rgba(180,83,9,.35)}
  .nm{font-size:16px;font-weight:600;color:var(--text-primary);display:flex;align-items:center;gap:5px}
  .meta{font-size:12px;color:var(--text-secondary);margin-top:3px}
  .dist{font-size:12px;color:var(--text-tertiary)}
  .price{font-size:16px;font-weight:600;color:var(--sunset);text-align:right}
  .unit{font-size:11px;color:var(--text-tertiary);text-align:right}
</style></head>
<body>
  <div class="pane light">
    <div class="tag">Light</div>
    <div class="card">
      <div class="av">MO</div>
      <div style="flex:1">
        <div class="nm">Maya Okafor <svg width="14" height="14" viewBox="0 0 24 24" fill="#059669"><path d="M12 1.6l2.6 1.9 3.2-.2 1 3.1 2.6 1.9-1 3 1 3-2.6 1.9-1 3.1-3.2-.2L12 22.4l-2.6-1.9-3.2.2-1-3.1L2.6 15.7l1-3-1-3 2.6-1.9 1-3.1 3.2.2L12 1.6Z"/><path d="M8.5 12l2.3 2.3 4.7-4.8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="meta">★ 4.9 · Anxious dogs</div>
        <div class="dist">0.4 mi away</div>
      </div>
      <div><div class="price">$25</div><div class="unit">/walk</div></div>
    </div>
  </div>
  <div class="pane dark" data-theme="dark">
    <div class="tag">Dark</div>
    <div class="card">
      <div class="av">MO</div>
      <div style="flex:1">
        <div class="nm">Maya Okafor <svg width="14" height="14" viewBox="0 0 24 24" fill="#059669"><path d="M12 1.6l2.6 1.9 3.2-.2 1 3.1 2.6 1.9-1 3 1 3-2.6 1.9-1 3.1-3.2-.2L12 22.4l-2.6-1.9-3.2.2-1-3.1L2.6 15.7l1-3-1-3 2.6-1.9 1-3.1 3.2.2L12 1.6Z"/><path d="M8.5 12l2.3 2.3 4.7-4.8" stroke="#1A1613" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="meta">★ 4.9 · Anxious dogs</div>
        <div class="dist">0.4 mi away</div>
      </div>
      <div><div class="price">$25</div><div class="unit">/walk</div></div>
    </div>
  </div>
</body></html>
