<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--bg-primary);font-family:var(--font-sans);display:flex;gap:20px}
  .item{text-align:center}
  .box{width:84px;height:84px;background:#fff;box-shadow:var(--shadow-card);border:1.5px solid var(--sunset)}
  .name{font-size:12px;font-weight:600;color:var(--text-primary);margin-top:10px}

<body>
  <div class="item"><div class="box" style="border-radius:8px"></div><div class="name">radiusSm</div><div class="val">8 · inputs</div></div>
  <div class="item"><div class="box" style="border-radius:12px"></div><div class="name">radiusMd</div><div class="val">12 · cards</div></div>
  <div class="item"><div class="box" style="border-radius:16px"></div><div class="name">radiusLg</div><div class="val">16 · sheets</div></div>
  <div class="item"><div class="box" style="border-radius:9999px"></div><div class="name">radiusFull</div><div class="val">pills · avatars</div></div>
</body></html>
