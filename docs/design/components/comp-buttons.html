<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:22px;background:var(--bg-primary);font-family:var(--font-sans)}
  .grid{display:flex;flex-direction:column;gap:12px;max-width:300px}
  .btn{height:56px;border-radius:12px;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:default}
  .primary{background:var(--sunset);color:#fff}
  .secondary{background:transparent;color:var(--sunset);box-shadow:inset 0 0 0 1.5px var(--sunset)}
  .destructive{background:transparent;color:var(--terracotta);box-shadow:inset 0 0 0 1.5px var(--terracotta)}
  .disabled{background:rgba(234,88,12,.6);color:#fff}
  .text{color:var(--sunset);font-size:15px;font-weight:500;text-align:center}
</style></head>
<body>
  <div class="grid">
    <div class="btn primary">Get Started</div>
    <div class="btn secondary">I already have an account</div>
    <div class="btn destructive">Log Out</div>
    <div class="btn disabled">Create Account</div>
    <div class="text">Forgot password?</div>
  </div>
</body></html>
