<!-- @dsCard group="Components" -->
<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
  body{margin:0;font-family:-apple-system,system-ui,sans-serif;display:flex}
  .wall{flex:1;padding:22px 18px;display:flex;align-items:center}
  .wall.light{background:linear-gradient(160deg,#FFF3E4,#FBC79A)}
  .wall.dark{background:linear-gradient(165deg,#2A1A12,#8B3A14)}
  .tag{position:absolute;top:10px;left:14px;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
  .lp{position:relative}
  .card{width:100%;border-radius:20px;padding:14px;box-sizing:border-box}
  .card.light{background:rgba(255,255,255,.55);backdrop-filter:blur(20px);border:.5px solid rgba(255,255,255,.6);box-shadow:0 8px 24px rgba(120,60,20,.18)}
  .card.dark{background:rgba(28,22,17,.5);backdrop-filter:blur(20px);border:.5px solid rgba(255,255,255,.12);box-shadow:0 8px 28px rgba(0,0,0,.4)}
  .hd{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .mk{width:22px;height:22px;border-radius:6px;background:#EA580C;display:flex;align-items:center;justify-content:center}
  .brand{font-size:12px;font-weight:600}
  .live{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:10px;font-weight:600;color:#EA580C;letter-spacing:.4px}
  .dot{width:6px;height:6px;border-radius:3px;background:#FB923C;box-shadow:0 0 6px #FB923C}
  .body{display:flex;align-items:center;gap:12px}
  .av{width:46px;height:46px;border-radius:23px;overflow:hidden;flex-shrink:0;box-shadow:0 0 0 2px rgba(234,88,12,.4)}
  .av img{width:100%;height:100%;object-fit:cover}
  .t{font-size:17px;font-weight:700}
  .s{font-size:12px;margin-top:2px}
  .pb{margin-top:12px;height:5px;border-radius:3px}
  .pf{width:40%;height:100%;border-radius:3px;background:linear-gradient(90deg,#FB923C,#FCD34D)}
  /* light card text */
  .light .brand{color:#5D4E37}.light .t{color:#1F1B17}.light .s{color:#5D4E37}
  .light .pb{background:rgba(120,60,20,.18)} .light .tag{color:#8B4A1A}
  /* dark card text */
  .dark .brand{color:rgba(255,255,255,.8)}.dark .t{color:#fff}.dark .s{color:rgba(255,255,255,.7)}
  .dark .pb{background:rgba(255,255,255,.2)} .dark .tag{color:rgba(255,255,255,.75)}
  .walkico{flex-shrink:0}
</style></head>
<body>
  <div class="wall light"><div class="lp" style="width:100%"><span class="tag">Light wallpaper</span>
    <div class="card light">
      <div class="hd"><div class="mk"><svg width="13" height="13" viewBox="0 0 24 24" fill="#fff"><ellipse cx="6" cy="11" rx="2.1" ry="2.7"/><ellipse cx="11" cy="8.2" rx="2.2" ry="2.9"/><ellipse cx="16.4" cy="9.4" rx="2.1" ry="2.7"/><ellipse cx="19" cy="14" rx="1.8" ry="2.3"/><path d="M11.6 13.2c2.6 0 4.7 1.7 5.2 3.9.4 1.8-1 3.2-2.7 3-1-.1-1.7-.5-2.5-.5s-1.5.4-2.5.5c-1.7.2-3.1-1.2-2.7-3 .5-2.2 2.6-3.9 5.2-3.9Z"/></svg></div><span class="brand">PawConnect</span><span class="live"><span class="dot"></span>LIVE</span></div>
      <div class="body"><div class="av"><img src="../assets/avatar-shiba-sketch.png"></div><div style="flex:1"><div class="t">Biscuit is on a walk</div><div class="s">Fed ✓ · Meds ✓ · 12 min in</div></div>
        <svg class="walkico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#EA580C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4.5" r="2"/><path d="M13 8l-3 4 1 4M10 12l-2.5 2M14 11l3 2-1.5 4M11 16l-2 5M16 17l1 4"/></svg></div>
      <div class="pb"><div class="pf"></div></div>
    </div></div></div>
  <div class="wall dark"><div class="lp" style="width:100%"><span class="tag">Dark wallpaper</span>
    <div class="card dark">
      <div class="hd"><div class="mk"><svg width="13" height="13" viewBox="0 0 24 24" fill="#fff"><ellipse cx="6" cy="11" rx="2.1" ry="2.7"/><ellipse cx="11" cy="8.2" rx="2.2" ry="2.9"/><ellipse cx="16.4" cy="9.4" rx="2.1" ry="2.7"/><ellipse cx="19" cy="14" rx="1.8" ry="2.3"/><path d="M11.6 13.2c2.6 0 4.7 1.7 5.2 3.9.4 1.8-1 3.2-2.7 3-1-.1-1.7-.5-2.5-.5s-1.5.4-2.5.5c-1.7.2-3.1-1.2-2.7-3 .5-2.2 2.6-3.9 5.2-3.9Z"/></svg></div><span class="brand">PawConnect</span><span class="live"><span class="dot"></span>LIVE</span></div>
      <div class="body"><div class="av"><img src="../assets/avatar-shiba-sketch.png"></div><div style="flex:1"><div class="t">Biscuit is on a walk</div><div class="s">Fed ✓ · Meds ✓ · 12 min in</div></div>
        <svg class="walkico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4.5" r="2"/><path d="M13 8l-3 4 1 4M10 12l-2.5 2M14 11l3 2-1.5 4M11 16l-2 5M16 17l1 4"/></svg></div>
      <div class="pb"><div class="pf"></div></div>
    </div></div></div>
</body></html>
