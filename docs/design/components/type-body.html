<!-- @dsCard group="Type" -->
<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--bg-primary);font-family:var(--font-sans)}
  .row{display:flex;align-items:baseline;gap:14px;padding:9px 0;border-bottom:1px solid var(--border)}
  .row:last-child{border-bottom:none}
  .tok{width:108px;flex-shrink:0;font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}
  .spec{margin-left:auto;font-size:11px;color:var(--text-tertiary);white-space:nowrap}
</style></head>
<body>
  <div class="row"><span class="tok">bodyLarge</span><span class="pc-body-lg">Every pet deserves care that feels like family.</span><span class="spec">17 · Reg</span></div>
  <div class="row"><span class="tok">bodyRegular</span><span class="pc-body">Browse local sitters and book with confidence.</span><span class="spec">15 · Reg</span></div>
  <div class="row"><span class="tok">bodySmall</span><span class="pc-body-sm">Quick check-ins at your pet's home</span><span class="spec">13 · Reg</span></div>
  <div class="row"><span class="tok">caption</span><span class="pc-caption">Last active 2 hours ago · 0.4 mi away</span><span class="spec">12 · Reg</span></div>
</body></html>
